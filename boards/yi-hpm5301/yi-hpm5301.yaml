board:
    soc: HPM5301
    device: HPM5301xEGx
    openocd-soc: hpm5300
    openocd-probe: cmsis_dap
    on-board-flash:
      type: qspi-nor-flash
      size: 1M
    feature:
      - board_usb_otg
