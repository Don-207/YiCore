compatible: "yi,stm32f1-adc"
driver: "adc"
header: "yi_adc_stm32f1.h"
define: "YI_ADC_STM32F1_DEFINE_LEVEL"

properties:
  reg:
    type: int
    required: true
  clock-bus:
    type: string
    required: true
  clock-enable-mask:
    type: int
    required: true
  input-pin:
    type: phandle
    required: true
  channel:
    type: int
    required: true
  sample-cycles:
    type: int
    default: 7
  clock-divider:
    type: int
    default: 6
  init-level:
    type: string
    default: post-kernel
  init-priority:
    type: int
    default: 20
