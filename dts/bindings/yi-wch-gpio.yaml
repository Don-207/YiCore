compatible: "yi,wch-gpio"
driver: "gpio"
header: "yi_gpio.h"
define: "YI_GPIO_DEFINE_LEVEL"

properties:
  port:
    type: identifier
    required: true
  pin:
    type: int
    required: true
  direction:
    type: string
    default: output
  drive:
    type: string
    default: push-pull
  pull:
    type: string
    default: none
  interrupt:
    type: string
    default: none
  irq-priority:
    type: int
    default: 10
  init-level:
    type: string
    default: pre-kernel
  init-priority:
    type: int
    default: 50
