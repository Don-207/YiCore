compatible: "ti,ads1258"
driver: "ads1258"
header: "yi_ads1258.h"
define: "YI_ADS1258_DEFINE_LEVEL"
properties:
  bus:
    type: phandle
    required: true
  cs-gpio:
    type: phandle
    required: true
  start-gpio:
    type: phandle
    required: true
  reset-gpio:
    type: phandle
    required: false
  drdy-gpio:
    type: phandle
    required: false
  spi-frequency:
    type: int
    default: 1000000
  transfer-timeout-ms:
    type: int
    default: 20
  config0:
    type: int
    default: 0
  config1:
    type: int
    default: 0
  muxsch:
    type: int
    default: 0
  muxdif:
    type: int
    default: 0
  single-ended-mask:
    type: int
    default: 65535
  system-readings:
    type: int
    default: 0
  init-level:
    type: string
    default: post-kernel
  init-priority:
    type: int
    default: 30
